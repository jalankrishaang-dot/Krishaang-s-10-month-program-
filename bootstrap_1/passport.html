<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shotify — Fixed US Passport AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/selfie_segmentation.js"></script>

  <style>
    body { font-family: 'DM Sans', sans-serif; background: #f8f9fa; color: #333; }
    .shotify-brand { font-family: 'Shadows Into Light', cursive; font-size: 2rem; font-weight: bold; color: #198754 !important; }
    .hero { padding: 40px 20px; text-align: center; background: white; border-bottom: 1px solid #eee; }
    .camera-box { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: -20px; position: relative; }
    #video { display: none; }
    #liveCanvas { width: 100%; border-radius: 15px; background: #000; transform: scaleX(-1); }
    #countdown { display: none; font-size: 120px; font-weight: 800; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 100; pointer-events: none; }
    .oval-guide { width: 220px; height: 280px; border: 3px dashed rgba(255, 255, 255, 0.7); border-radius: 50%; pointer-events: none; z-index: 5; }
    #resultSection { display: none; text-align: center; padding: 40px 0; }
    #resultCanvas { width: 300px; height: 300px; border: 8px solid white; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border-radius: 4px; }
    #flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 9999; }
    footer { margin-top: 60px; padding: 30px; text-align: center; background: #212529; color: white; }
  </style>
</head>

<body>
  <div id="flash"></div>

  <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand shotify-brand" href="#">Shotify</a>
      <button class="btn btn-outline-success btn-sm" onclick="location.reload()">Reset</button>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1>US Passport Photo</h1>
      <p class="text-muted">High-Res 2x2 Inch Square (600x600px)</p>
    </div>
  </section>

  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div id="cameraInterface">
          <div class="camera-box text-center">
            <div class="position-relative">
              <div id="countdown" class="position-absolute top-50 start-50 translate-middle">3</div>
              <video id="video" autoplay playsinline></video>
              <canvas id="liveCanvas"></canvas>
              <div class="oval-guide position-absolute top-50 start-50 translate-middle"></div>
              <div class="position-absolute bottom-0 start-0 end-0 p-3">
                <div class="bg-dark text-white rounded-4 p-3 shadow-lg opacity-90">
                  <div id="aiText" class="mb-1">Click "Start AI" to begin</div>
                  <div class="progress" style="height: 4px;">
                    <div id="barFill" class="progress-bar bg-success" style="width: 0%"></div>
                  </div>
                </div>
              </div>
            </div>
            <button class="btn btn-success btn-lg mt-4 px-5 shadow" id="allowBtn">Start AI Analysis</button>
          </div>
        </div>

        <div id="resultSection">
          <div class="card p-4 shadow-sm text-center">
            <h2 class="mb-4">Final Passport Photo</h2>
            <canvas id="resultCanvas" class="mx-auto d-block"></canvas>
            <div class="d-grid gap-2 d-md-block mt-4">
              <button class="btn btn-success btn-lg px-5" onclick="downloadPhoto()">Download HQ Image</button>
              <button class="btn btn-outline-secondary btn-lg" onclick="location.reload()">Try Again</button>
            </div>
            <p class="text-muted mt-3 small">Format: 600x600 px (US Government Standard)</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const liveCanvas = document.getElementById('liveCanvas');
    const liveCtx = liveCanvas.getContext('2d');
    const resultCanvas = document.getElementById('resultCanvas');
    const countdownEl = document.getElementById('countdown');
    const aiText = document.getElementById('aiText');
    const barFill = document.getElementById('barFill');
    const allowBtn = document.getElementById('allowBtn');

    let stream = null, segmenter = null, rafId = null;
    let photoTaken = false, bgReady = false, countingDown = false;
    let readiness = 0;

    allowBtn.onclick = startApp;

    async function startApp() {
        allowBtn.disabled = true;
        allowBtn.textContent = "Loading AI...";
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            await new Promise(res => video.onloadeddata = res);

            segmenter = new SelfieSegmentation({
                locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1/${f}`
            });
            segmenter.setOptions({ modelSelection: 1 });
            segmenter.onResults(onSegResult);
            
            await segmenter.initialize();
            bgReady = true;
            renderLoop();
            speak("Ready. Hold still.");
        } catch(e) {
            alert("Camera error: " + e);
            allowBtn.disabled = false;
        }
    }

    function onSegResult(results) {
        if (photoTaken) return;
        const w = video.videoWidth;
        const h = video.videoHeight;
        liveCanvas.width = w;
        liveCanvas.height = h;

        liveCtx.save();
        
        // Step 1: Draw the full camera image
        liveCtx.drawImage(results.image, 0, 0, w, h);

        // Step 2: Use the AI mask to "delete" the background
        // 'destination-in' keeps ONLY the pixels of the image that match the mask
        liveCtx.globalCompositeOperation = 'destination-in';
        liveCtx.drawImage(results.segmentationMask, 0, 0, w, h);

        // Step 3: Draw a white background BEHIND the person
        // 'destination-over' puts the next thing we draw behind whatever is already there
        liveCtx.globalCompositeOperation = 'destination-over';
        liveCtx.fillStyle = '#ffffff';
        liveCtx.fillRect(0, 0, w, h);

        liveCtx.restore();

        checkPositioning();
    }

    function checkPositioning() {
        if (photoTaken || countingDown) return;
        readiness = Math.min(readiness + 2, 100);
        barFill.style.width = readiness + "%";
        
        if (readiness < 100) {
            aiText.textContent = "AI Stabilizing background...";
        } else {
            aiText.textContent = "POSITION PERFECT. DON'T MOVE.";
            beginCountdown();
        }
    }

    function renderLoop() {
        if (photoTaken) return;
        if (video.readyState >= 2) segmenter.send({ image: video });
        rafId = requestAnimationFrame(renderLoop);
    }

    function beginCountdown() {
        if (countingDown) return;
        countingDown = true;
        let n = 3; 
        countdownEl.textContent = n;
        countdownEl.style.display = 'block';

        const tick = setInterval(() => {
            n--;
            if (n > 0) {
                countdownEl.textContent = n;
                speak(n.toString());
            } else {
                clearInterval(tick);
                takePhoto();
            }
        }, 1000);
    }

    function takePhoto() {
        photoTaken = true;
        document.getElementById('flash').style.opacity = '1';
        setTimeout(() => document.getElementById('flash').style.opacity = '0', 150);

        // US Digital Passport Standard: 600x600 pixels
        resultCanvas.width = 600;
        resultCanvas.height = 600;
        const rCtx = resultCanvas.getContext('2d');

        const w = liveCanvas.width;
        const h = liveCanvas.height;
        
        // Square crop from center
        const side = Math.min(w, h) * 0.85; 
        const sx = (w - side) / 2;
        const sy = (h - side) / 2;

        rCtx.save();
        rCtx.translate(600, 0);
        rCtx.scale(-1, 1); // Flip to correct the mirror
        rCtx.drawImage(liveCanvas, sx, sy, side, side, 0, 0, 600, 600);
        rCtx.restore();

        document.getElementById('cameraInterface').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';
        if (stream) stream.getTracks().forEach(t => t.stop());
        speak("Photo taken.");
    }

    function downloadPhoto() {
        const link = document.createElement('a');
        link.download = 'US-Passport-600x600.jpg';
        link.href = resultCanvas.toDataURL('image/jpeg', 0.95);
        link.click();
    }

    function speak(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(u);
    }
  </script>
</body>
</html>
